name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "填版本号（如 v1.0）则构建完自动创建标签并发布 Release；留空只构建"
        required: false
        default: ""

jobs:
  build:
    name: 校验内容 · 单元测试 · 打包 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建 Release 需要写权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验课程内容
        run: python3 tools/validate_content.py

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不用 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而 tools 包早已从 SDK 仓库下架，必然失败。runner 自带 SDK，直接补装所需组件。
      - name: 安装 Android SDK 组件
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShenzhenPrimaryEnglish-debug.apk
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ShenzhenPrimaryEnglish-debug-apk
          path: dist/ShenzhenPrimaryEnglish-debug.apk
          if-no-files-found: error

      - name: 发布 Release（附带 APK）
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eu
          # 版本号来源优先级：手动输入 > v* 标签名 > build.gradle 里的 versionName
          VERSION="${RELEASE_TAG:-}"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) VERSION="$GITHUB_REF_NAME" ;;
              *) VERSION="v$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' app/build.gradle | head -1)" ;;
            esac
          fi
          echo "发布版本：$VERSION"
          APK="dist/ShenzhenPrimaryEnglish-${VERSION}.apk"
          cp dist/ShenzhenPrimaryEnglish-debug.apk "$APK"
          cat > /tmp/notes.md <<'NOTES'
          面向深圳小学一至六年级的英语自学应用：**知识引导** + **练习验证**，完全离线。

          ## 安装

          1. 用手机浏览器点下面的 `.apk` 附件下载
          2. 打开下载的文件，按提示允许「安装未知来源应用」
          3. 需要 Android 7.0（API 24）及以上

          ## 内容

          6 个年级 / 36 个话题单元 / 408 个词条（音标 + 词性 + 释义 + 中英例句）/
          108 条核心句型 / 72 个语法讲解。

          ## 功能

          - 知识引导：词卡、朗读、标记已掌握、单元词表、核心句型、语法讲解、自然拼读
          - 练习验证：中译英 / 英译中 / 单词拼写 / 句型填空 / 连词成句，即时判分 + 解析
          - 错题本（连续答对两次自动移出）、Leitner 间隔复习（1/2/4/7 天）、学习统计

          ## 说明

          - 不申请任何权限，不联网，学习进度只存本机
          - 朗读依赖系统英语 TTS 引擎，没有也不影响其它功能
          - 内容按深圳小学常见话题顺序自行编写整理，不是任何出版社教材的原文摘录，
            具体以学校所用教材和老师的要求为准
          NOTES
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" "$APK" --clobber
            gh release edit "$VERSION" --notes-file /tmp/notes.md
          else
            # 标签不存在时 gh 会在 --target 指向的提交上自动创建
            gh release create "$VERSION" "$APK" \
              --target "$GITHUB_SHA" \
              --title "深圳小学英语 $VERSION" \
              --notes-file /tmp/notes.md
          fi
          echo "Release 地址：$(gh release view "$VERSION" --json url --jq .url)"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
