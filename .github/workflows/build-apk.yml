name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 校验内容 · 单元测试 · 打包 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验课程内容
        run: python3 tools/validate_content.py

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShenzhenPrimaryEnglish-debug.apk
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ShenzhenPrimaryEnglish-debug-apk
          path: dist/ShenzhenPrimaryEnglish-debug.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
