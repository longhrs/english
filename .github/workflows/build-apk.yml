name: Build APK & PC

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "填版本号（如 v1.0）则构建完自动创建标签并发布 Release；留空只构建"
        required: false
        default: ""

jobs:
  android:
    name: 校验内容 · 单元测试 · 打包 APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验课程内容
        run: python3 tools/validate_content.py

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 不用 android-actions/setup-android：它内部会跑 `sdkmanager tools`，
      # 而 tools 包早已从 SDK 仓库下架，必然失败。runner 自带 SDK，直接补装所需组件。
      - name: 安装 Android SDK 组件
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShenzhenPrimaryEnglish-debug.apk
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ShenzhenPrimaryEnglish-debug-apk
          path: dist/ShenzhenPrimaryEnglish-debug.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  desktop:
    name: PC 版 · 单元测试 · 打包 Windows 程序
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        # 用 gradlew.bat：Windows 上检出时可能是 CRLF 换行，bash 跑 ./gradlew 会出错
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # PC 版是独立的 Gradle 构建（desktop/），与 Android 版共用核心层源码和课程数据
      - name: 单元测试（PC 版）
        run: ./gradlew.bat -p desktop test --no-daemon --stacktrace

      - name: 打包可执行 jar 与 Windows 免安装程序
        run: ./gradlew.bat -p desktop fatJar appImage --no-daemon --stacktrace

      - name: 整理产物
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Select-String -Path app/build.gradle -Pattern 'versionName\s+"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "desktop/build/dist/ShenzhenPrimaryEnglish-PC-$v.jar" "dist/ShenzhenPrimaryEnglish-PC-v$v.jar"
          Compress-Archive -Path desktop/build/jpackage/output/ShenzhenPrimaryEnglish `
            -DestinationPath "dist/ShenzhenPrimaryEnglish-PC-v$v-windows.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: 上传 PC 版
        uses: actions/upload-artifact@v4
        with:
          name: ShenzhenPrimaryEnglish-pc
          path: dist/*
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: 发布 Release（APK + PC 版）
    needs: [android, desktop]
    # main → 正式版（按 versionName）；dev → 覆盖更新预发布的「dev 试用版」，免登录下载用于验证
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建 Release 需要写权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: ShenzhenPrimaryEnglish-debug-apk
          path: dist

      - name: 下载 PC 版
        uses: actions/download-artifact@v4
        with:
          name: ShenzhenPrimaryEnglish-pc
          path: dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eu
          # 版本号来源优先级：手动输入 > v* 标签名 > build.gradle 里的 versionName
          VERSION="${RELEASE_TAG:-}"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) VERSION="$GITHUB_REF_NAME" ;;
              refs/heads/dev) VERSION="dev-latest" ;;
              *) VERSION="v$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' app/build.gradle | head -1)" ;;
            esac
          fi
          echo "发布版本：$VERSION"
          ls -l dist
          APK="dist/ShenzhenPrimaryEnglish-${VERSION}.apk"
          cp dist/ShenzhenPrimaryEnglish-debug.apk "$APK"
          # PC 版文件名里的版本号来自 versionName，与 VERSION 不同时（手动指定版本）统一改名
          PC_ZIP="dist/ShenzhenPrimaryEnglish-PC-${VERSION}-windows.zip"
          PC_JAR="dist/ShenzhenPrimaryEnglish-PC-${VERSION}.jar"
          [ -f "$PC_ZIP" ] || mv dist/ShenzhenPrimaryEnglish-PC-v*-windows.zip "$PC_ZIP"
          [ -f "$PC_JAR" ] || mv dist/ShenzhenPrimaryEnglish-PC-v*.jar "$PC_JAR"

          if [ "$VERSION" = "dev-latest" ]; then
            # dev 试用版：删掉旧的再在当前提交上重建，标签跟着移动；标记为预发布，不影响「最新正式版」
            SHORT="${GITHUB_SHA:0:7}"
            cat > /tmp/dev-notes.md <<EOF
          **这是开发分支 dev 的试用版，还没有正式发布**，用于在手机和电脑上验证新改动。
          每次推送 dev 都会覆盖更新，正式版本请看标为 Latest 的 Release。

          - 构建自提交 \`${SHORT}\`（$(date -u '+%Y-%m-%d %H:%M') UTC）
          - Windows：下载 \`ShenzhenPrimaryEnglish-PC-dev-latest-windows.zip\`，解压后双击 \`ShenzhenPrimaryEnglish.exe\`；
            首次运行若提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」
          - 安卓：下载 \`ShenzhenPrimaryEnglish-dev-latest.apk\` 安装
          - macOS / Linux：下载 \`ShenzhenPrimaryEnglish-PC-dev-latest.jar\`（需 Java 17+）
          EOF
            gh release delete "$VERSION" --cleanup-tag --yes > /dev/null 2>&1 || true
            gh release create "$VERSION" "$APK" "$PC_ZIP" "$PC_JAR" \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "dev 试用版（未正式发布）" \
              --notes-file /tmp/dev-notes.md
            echo "Release 地址：$(gh release view "$VERSION" --json url --jq .url)"
            exit 0
          fi
          cat > /tmp/notes.md <<'NOTES'
          面向深圳小学一至六年级的英语自学应用：**知识引导** + **练习验证**，完全离线。

          ## 下载哪个

          | 设备 | 下载 | 说明 |
          | --- | --- | --- |
          | 安卓手机 / 平板 | `ShenzhenPrimaryEnglish-vX.Y.apk` | Android 7.0 及以上，安装时允许「安装未知来源应用」 |
          | Windows 电脑 | `ShenzhenPrimaryEnglish-PC-vX.Y-windows.zip` | 免安装、自带运行环境：解压后双击 `ShenzhenPrimaryEnglish.exe` |
          | macOS / Linux 电脑 | `ShenzhenPrimaryEnglish-PC-vX.Y.jar` | 需先安装 Java 17 及以上，双击或 `java -jar` 运行 |

          Windows 首次运行若弹出「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」即可
          （程序没有购买代码签名证书，不是病毒提示）。

          手机版和电脑版内容、出题规则完全相同；学习进度各自保存在本机，互不影响。

          ## 内容

          6 个年级 / 56 个话题单元 / 624 个词条（音标 + 词性 + 释义 + 中英例句）/
          168 条核心句型 / 112 个语法讲解。

          **按 2024 新版沪教版课本编排**（上海教育出版社·义务教育教科书）：
          三年级上册全部 8 个单元、三年级下册已核实的 4 个单元、四年级上册已核实的 2 个单元，
          单元标题与课本一致；其余单元暂作拓展话题，新版目录核实后再补齐。

          ## 功能

          - 知识引导：词卡、朗读、标记已掌握、单元词表、核心句型、语法讲解、自然拼读
          - 练习验证：中译英 / 英译中 / 单词拼写 / 句型填空 / 连词成句，即时判分 + 解析
          - 错题本（连续答对两次自动移出）、Leitner 间隔复习（1/2/4/7 天）、学习统计

          ## 说明

          - 不申请任何权限，不联网，学习进度只存本机
          - 电脑版快捷键：词卡 ← → 切换、空格看释义；练习 1–4 / A–D 选择，Enter 下一题；Esc 返回
          - 朗读依赖系统英语语音引擎（手机用系统 TTS，Windows 用系统自带语音），没有也不影响其它功能
          - 单元主题对照课本编排，单词、句子和讲解为本项目自行编写，不是课本原文摘录，
            具体以学校当年所用课本和老师的要求为准
          NOTES
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" "$APK" "$PC_ZIP" "$PC_JAR" --clobber
            gh release edit "$VERSION" --notes-file /tmp/notes.md
          else
            # 标签不存在时 gh 会在 --target 指向的提交上自动创建
            gh release create "$VERSION" "$APK" "$PC_ZIP" "$PC_JAR" \
              --target "$GITHUB_SHA" \
              --title "深圳小学英语 $VERSION" \
              --notes-file /tmp/notes.md
          fi
          echo "Release 地址：$(gh release view "$VERSION" --json url --jq .url)"
